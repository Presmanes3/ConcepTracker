services:
  db:
    image: pgvector/pgvector:pg16
    container_name: concept_db
    environment:
      POSTGRES_USER: ct_user
      POSTGRES_PASSWORD: ct_password
      POSTGRES_DB: concept_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ct_user -d concept_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
