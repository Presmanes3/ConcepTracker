services:
  db:
    image: pgvector/pgvector:pg16
    container_name: concept_db
    environment:
      POSTGRES_USER: ct_user
      POSTGRES_PASSWORD: ct_password
      POSTGRES_DB: concept_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ct_user -d concept_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: concept_api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Mount config/ read-only so settings.yaml is available inside the container.
      - ./config:/app/config:ro
    environment:
      # Database
      DATABASE_URL: postgresql://ct_user:ct_password@db:5432/concept_db
      # Tell ServiceRegistry and ConfigRepository where settings.yaml lives.
      CONCEPTRACKER_CONFIG: /app/config/settings.yaml
      # AWS credentials — sourced from the host .env file.
    env_file:
      - .env
    restart: unless-stopped

volumes:
  postgres_data:

